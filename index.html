<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Plan de Metas</title>
<style>
  :root{
    --ink:#1c1a17; --paper:#faf7f2; --gold:#8a6d1f; --gold-soft:#e8dcb8;
    --line:#d8cfae; --muted:#6b6459; --red:#a3492f;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Iowan Old Style','Georgia',serif; padding:16px 14px 50px;}
  h1{font-size:1.4rem; font-weight:600; margin:0 0 4px;}
  .fecha{font-size:0.83rem; color:var(--muted); margin-bottom:16px; font-style:italic;}
  .tabs{display:flex; border-bottom:2px solid var(--line); margin-bottom:16px;}
  .tab-btn{flex:1; background:none; border:none; padding:10px 4px; font-family:inherit; font-size:0.8rem; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px;}
  .tab-btn.active{color:var(--gold); border-bottom:2px solid var(--gold); font-weight:600;}
  .tab-content{display:none; border:1px solid var(--line); background:white; border-radius:3px; padding:0; overflow:hidden;}
  .tab-content.active{display:block;}
  .placeholder{padding:20px; text-align:center; color:var(--muted); font-size:0.9rem;}
  .bloque-header{padding:12px 14px; border-bottom:1px solid var(--gold-soft); background:#fffdf9;}
  .bloque-header h2{font-size:1rem; margin:0;}
  .tarea{display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-bottom:1px solid #f0ebe0; font-size:0.9rem; cursor:pointer;}
  .tarea:last-child{border-bottom:none;}
  .tarea.done .txt{text-decoration:line-through; color:var(--muted);}
  .check{width:18px; height:18px; border:1.5px solid var(--gold); border-radius:3px; flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center;}
  .tarea.done .check{background:#3f6b4a; border-color:#3f6b4a;}
  .tarea.done .check::after{content:'✓'; color:white; font-size:12px;}
  .txt{flex:1;}
  .nivel-item{border-left:3px solid #d8cfae; padding:7px 0 7px 12px; margin-bottom:2px;}
  .nivel-item.actual{border-left:3px solid #8a6d1f; background:#fdf8ec;}
  .nivel-item b{font-size:0.88rem;}
  .nivel-item .detalle{font-size:0.78rem; color:#6b6459; margin-top:3px; line-height:1.5;}
  .btn-examen{background:#8a6d1f; color:white; border:none; border-radius:3px; padding:10px 16px; font-size:0.85rem; cursor:pointer; font-family:inherit; width:100%;}
  .pregunta-card{margin-bottom:14px; padding:10px; border:1px solid #d8cfae; border-radius:3px;}
  .pregunta-card .enunciado{font-size:0.87rem; font-weight:600; margin-bottom:6px;}
  .pregunta-card label{display:block; font-size:0.83rem; margin-bottom:4px;}
  .mensaje-jefe{border-left:4px solid var(--red); background:#fbecec; padding:10px 12px; margin-bottom:14px; font-size:0.87rem; font-weight:600; color:#7a2f1e; border-radius:0 3px 3px 0;}
  .mensaje-jefe.ok{border-left:4px solid var(--gold); background:#fdf5e9; color:#6b5218;}
  .mensaje-jefe.exito{border-left:4px solid #3f6b4a; background:#eaf3ec; color:#2a4a33;}
  .form-intro{padding:14px; border-bottom:1px dashed var(--line);}
  .form-intro .campo{margin-bottom:10px;}
  .form-intro label{font-size:0.75rem; color:var(--muted); display:block; margin-bottom:3px;}
  .form-intro input, .form-intro select{width:100%; border:1px solid var(--line); border-radius:3px; padding:8px 9px; font-size:0.87rem; font-family:inherit;}
  .form-intro .fila2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn-guardar-intro{background:var(--gold); color:white; border:none; border-radius:3px; padding:10px 16px; font-size:0.85rem; cursor:pointer; font-family:inherit; width:100%; margin-top:4px;}
  .resumen-fisico{padding:14px; border-bottom:1px dashed var(--line); font-size:0.85rem; line-height:1.6;}
  .resumen-fisico b{color:var(--gold);}
  .link-editar{background:none; border:none; color:var(--muted); font-size:0.76rem; text-decoration:underline; cursor:pointer; font-family:inherit; padding:0; margin-top:4px;}
  .panel-especialista{margin-top:10px; border:1px solid var(--line); border-radius:3px; overflow:hidden;}
  .panel-especialista .titulo-esp{background:#fffdf9; padding:8px 10px; font-size:0.82rem; font-weight:600; color:var(--gold); border-bottom:1px solid var(--gold-soft);}
  .panel-especialista .cuerpo-esp{padding:10px; font-size:0.8rem; line-height:1.6;}
  .panel-especialista ul{margin:4px 0; padding-left:18px;}
  .macro-tabla{width:100%; border-collapse:collapse; margin-top:6px; font-size:0.78rem;}
  .macro-tabla td{padding:4px 6px; border-bottom:1px solid #f0ebe0;}
  .medidas-panel{padding:14px; border-bottom:1px dashed var(--line);}
  .medidas-panel .titulo-med{font-size:0.85rem; font-weight:600; color:var(--gold); margin-bottom:8px;}
  .medidas-panel .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px;}
  .medidas-panel .campo label{font-size:0.7rem; color:var(--muted); display:block; margin-bottom:3px;}
  .medidas-panel .campo input{width:100%; border:1px solid var(--line); border-radius:3px; padding:7px 8px; font-size:0.83rem; font-family:inherit;}
  .medidas-ultimo{font-size:0.76rem; color:var(--muted); margin-top:6px; line-height:1.5;}
</style>
</head>
<body>

<h1>Mi Plan de Metas</h1>
<div class="fecha" id="fecha"></div>
<div id="mensajeJefe" class="mensaje-jefe"></div>

<div class="tabs">
  <button class="tab-btn active" data-tab="fisico">💪 Físico</button>
  <button class="tab-btn" data-tab="ingles">🇬🇧 Inglés</button>
  <button class="tab-btn" data-tab="joyeria">💍 Joyería</button>
  <button class="tab-btn" data-tab="vida">🎯 Vida</button>
</div>

<div class="tab-content active" id="tab-fisico">
  <div id="introFisico"></div>
  <div id="medidasFisico"></div>
  <div class="bloque-header"><h2 id="tituloFisicoHoy">Ejercicio de hoy — casa/parque</h2></div>
  <div id="listaFisico"></div>
</div>
<div class="tab-content" id="tab-ingles">
  <div class="bloque-header"><h2 id="tituloNivelIngles">Inglés — Nivel A1</h2></div>
  <div id="listaIngles"></div>
  <div style="padding:14px; border-top:1px dashed #d8cfae;">
    <div style="font-size:0.85rem; font-weight:600; color:#8a6d1f; margin-bottom:10px;">Temario completo — A1 a C2</div>
    <div id="temarioIngles"></div>
  </div>
  <div style="padding:14px; border-top:1px dashed #d8cfae;">
    <button id="btnIniciarExamen" class="btn-examen">Presentar evaluación de nivel</button>
    <div id="examenIngles"></div>
  </div>
</div>
<div class="tab-content" id="tab-joyeria">
  <div class="bloque-header"><h2>Joyeria — operacion diaria</h2></div>
  <div id="listaJoyeria"></div>
</div>
<div class="tab-content" id="tab-vida"><div class="placeholder">Aquí irá el contenido de Vida</div></div>

<div style="text-align:center; margin-top:24px;">
  <button id="btnBorrarTodo" style="background:none; border:1px solid var(--red); color:var(--red); padding:8px 16px; border-radius:3px; font-size:0.76rem; cursor:pointer; font-family:inherit;">Borrar todos los datos (reiniciar app)</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var hoy = new Date();
  var dias = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
  document.getElementById('fecha').textContent = dias[hoy.getDay()] + ', ' + hoy.getDate() + '/' + (hoy.getMonth()+1) + '/' + hoy.getFullYear();

  var tiposDia = {

      normal:[

      bajo:[
        {t:'Flexiones inclinadas (manos en superficie elevada)', s:'3 series x 8-10 reps, menor carga en muñecas/hombros'},

    },
    fuerza_superior: {
      normal:[
        {t:'Flexiones de pecho', s:'4 series x 8-12 reps'},

        {t:'Plancha abdominal', s:'3 series x 30-45 seg'}

      bajo:[
        {t:'Flexiones inclinadas (manos en superficie elevada)', s:'3 series x 8-10 reps'},

    fuerza_inferior: {
      normal:[
        {t:'Sentadillas', s:'4 series x 12-15 reps'},
        {t:'Zancadas alternadas', s:'3 series x 10 reps por pierna'},
        {t:'Puente de gluteo', s:'3 series x 15 reps'},
        {t:'Sentadilla isometrica en pared', s:'3 series x 30-40 seg'}
      ],
      bajo:[
        {t:'Sentadilla asistida en silla', s:'3 series x 10-12 reps, cuida rodillas'},
        {t:'Elevacion de talones sentado', s:'3 series x 15 reps'},
        {t:'Puente de gluteo', s:'3 series x 12-15 reps, sin forzar lumbar'},

        {t:'Trote o caminata rapida', s:'20-25 min continuos'},

      ],
      bajo:[
        {t:'Caminata rapida (plano o subida suave)', s:'25-30 min continuos'},
        {t:'Step-ups controlados en escalon bajo', s:'4 series x 10 reps'},
        {t:'Caminata de enfriamiento', s:'5 min'}
      ]
    },
    cardio_largo: {
      normal:[
        {t:'Caminata larga o trote suave', s:'35-45 min, ritmo conversacional'},
        {t:'Estiramiento final', s:'10 min'}
      ],
      bajo:[
        {t:'Caminata larga a ritmo comodo', s:'35-45 min, sin trotar'},
        {t:'Estiramiento final', s:'10 min'}
      ]
    },
    movilidad: {normal:[
      {t:'Estiramiento general', s:'10-15 min, todo el cuerpo'},
      {t:'Movilidad articular (hombros, cadera, tobillos)', s:'10 min'}
    ]},
    descanso_activo: {normal:[
      {t:'Caminata suave', s:'20-30 min, ritmo relajado'}
    ]},
    descanso: {normal:[
      {t:'Descanso', s:'Sin ejercicio estructurado, estiramiento opcional'}
    ]},
    rehab: {normal:[
      {t:'Movilidad suave sin dolor', s:'10 min, rango de movimiento controlado'},
      {t:'Ejercicios de estabilidad segun tu fisioterapeuta', s:''},
      {t:'Caminata corta si esta autorizada', s:'10-15 min'}
    ]}
  };

  var plantillasSemana = {
    'Perdida de peso': ['descanso','fuerza_fullbody','cardio','fuerza_fullbody','cardio','fuerza_fullbody','cardio_largo'],
    'Aumento de masa muscular': ['descanso','fuerza_superior','fuerza_inferior','descanso_activo','fuerza_superior','fuerza_inferior','fuerza_fullbody'],
    'Mantenimiento / tonificacion': ['descanso','fuerza_fullbody','cardio','movilidad','fuerza_fullbody','cardio','descanso_activo'],
    'Mejorar resistencia cardiovascular': ['descanso','cardio','fuerza_inferior','cardio','cardio_largo','fuerza_superior','cardio'],
    'Aumentar fuerza': ['descanso','fuerza_superior','fuerza_inferior','descanso','fuerza_fullbody','descanso_activo','fuerza_superior'],
    'Flexibilidad / movilidad': ['descanso','movilidad','movilidad','descanso_activo','movilidad','movilidad','descanso_activo'],
    'Recuperacion de una lesion': ['descanso','rehab','rehab','descanso','rehab','rehab','descanso']
  };

  var nombresTiposDia = {
    fuerza_fullbody:'Fuerza full body', fuerza_superior:'Fuerza tren superior', fuerza_inferior:'Fuerza tren inferior',
    cardio:'Cardio', cardio_largo:'Cardio largo', movilidad:'Movilidad y estiramiento',
    descanso_activo:'Descanso activo', descanso:'Descanso', rehab:'Recuperacion / rehabilitacion'
  };

  var restDayPatterns = {3:[0,2,4,6], 4:[0,3,5], 5:[0,3], 6:[0]};

  function obtenerTiposEntrenoObjetivo(objetivo){
    var base = plantillasSemana[objetivo] || plantillasSemana['Mantenimiento / tonificacion'];
    var tipos = [];
    for(var i=0; i<base.length; i++){
      if(base[i] !== 'descanso' && tipos.indexOf(base[i]) === -1) tipos.push(base[i]);
    }
    if(tipos.length === 0) tipos = ['fuerza_fullbody'];
    return tipos;
  }

  function generarPlantillaSemanaDinamica(objetivo, dias){
    var diasNum = dias || 4;
    var restDays = restDayPatterns[diasNum] || restDayPatterns[4];
    var tiposEntreno = obtenerTiposEntrenoObjetivo(objetivo);
    var plantilla = [];
    var ti = 0;
    for(var d=0; d<7; d++){
      if(restDays.indexOf(d) !== -1){ plantilla.push('descanso'); }
      else { plantilla.push(tiposEntreno[ti % tiposEntreno.length]); ti++; }
    }
    return plantilla;
  }

  function nombreTipoDiaHoy(){
    if(!perfilFisico) return 'Completa tu perfil';
    var plantilla = generarPlantillaSemanaDinamica(perfilFisico.objetivo, perfilFisico.dias);
    return nombresTiposDia[plantilla[hoy.getDay()]];
  }

  function progresoEnContra(){
    if(medidasHistorial.length < 1 || !perfilFisico || !perfilFisico.peso) return false;
    var ultimo = medidasHistorial[medidasHistorial.length-1];
    if(!ultimo.peso) return false;
    var cambio = ultimo.peso - perfilFisico.peso;
    if(perfilFisico.objetivo === 'Perdida de peso' && cambio > 1) return true;
    if(perfilFisico.objetivo === 'Aumento de masa muscular' && cambio < -1) return true;
    return false;
  }

  function generarTareasFisicoHoy(){
    if(!perfilFisico || !perfilFisico.objetivo){
      return [{t:'Completa tu perfil arriba para generar tu plan de ejercicio', s:'Sin nombre/objetivo guardado, no hay plan que mostrar'}];
    }
    var diaSemana = hoy.getDay();
    var objetivo = perfilFisico.objetivo;
    var plantilla = generarPlantillaSemanaDinamica(objetivo, perfilFisico.dias);
    var tipoHoy = plantilla[diaSemana];
    var fueraDeObjetivo = progresoEnContra();
    var bajoImpacto = esBajoImpacto(perfilFisico) || fueraDeObjetivo;
    var banco = tiposDia[tipoHoy];
    var lista = (bajoImpacto && banco.bajo) ? banco.bajo : banco.normal;
    lista = lista.concat([{t:'8000-10000 pasos', s:''}, {t:'Agua: 2-2.5 litros', s:''}]);
    if(fueraDeObjetivo && objetivo === 'Perdida de peso'){
      lista = lista.concat([{t:'🔺 Ajuste por progreso: 15 min extra de caminata', s:'Tu peso va en contra de tu objetivo — este bloque se agrego automaticamente'}]);
    }
    return lista;
  }


  var tareasPorNivel = {
    A1: [
      {t:'Vocabulario nuevo', s:'10 palabras basicas, repite en voz alta'},
      {t:'Frases simples', s:'escribe 5 frases con el vocabulario de hoy'},
      {t:'Escuchar 10 minutos', s:'video o cancion sencilla en ingles'},
      {t:'Repasar con Anki', s:'repite las tarjetas del dia anterior'}
    ],
    A2: [
      {t:'Practicar pasado simple', s:'escribe 5 oraciones sobre lo que hiciste ayer'},
      {t:'Vocabulario de viajes y comida', s:'10 palabras nuevas'},
      {t:'Ver un episodio de Extra English', s:'con subtitulos en ingles'},
      {t:'Grabarte hablando', s:'cuenta tu rutina diaria en pasado, 1 minuto'}
    ],
    B1: [
      {t:'Practicar presente perfecto', s:'escribe 5 oraciones sobre experiencias (I have been to...)'},
      {t:'Aprender 5 phrasal verbs nuevos', s:'usalos en una oracion cada uno'},
      {t:'Escuchar BBC 6 Minute English', s:'toma notas de vocabulario nuevo'},
      {t:'Conversacion de 10 minutos', s:'con tutor de italki o intercambio de idiomas'}
    ],
    B2: [
      {t:'Practicar voz pasiva', s:'reescribe 5 oraciones en voz pasiva'},
      {t:'Leer un articulo de noticias', s:'resumelo en tus palabras, 5 lineas'},
      {t:'Ver un episodio sin subtitulos en espanol', s:'The Office o similar'},
      {t:'Escribir un parrafo argumentativo', s:'100 palabras sobre un tema de tu eleccion'}
    ],
    C1: [
      {t:'Ver una charla TED completa', s:'toma notas de vocabulario nuevo'},
      {t:'Practicar registro formal', s:'reescribe un email informal en tono formal'},
      {t:'Escuchar un acento distinto al habitual', s:'britanico, australiano, etc.'},
      {t:'Escribir un ensayo de 150 palabras', s:'sobre un tema de actualidad'}
    ],
    C2: [
      {t:'Ver una pelicula sin subtitulos', s:''},
      {t:'Participar en un debate', s:'con hablante nativo o grupo de conversacion'},
      {t:'Leer un articulo de The Economist', s:'resume el argumento principal'},
      {t:'Identificar 3 expresiones idiomaticas', s:'en algo que veas o escuches hoy'}
    ]
  };

  var tareasJoyeria = [

    {t:'Publicar 1 contenido', s:'foto de producto o detras de camaras'},
    {t:'Responder WhatsApp/Instagram/Facebook', s:'menos de 2 horas de respuesta'},
    {t:'Revisar ventas del dia anterior', s:'anota en tu hoja de seguimiento'}
  ];

  // nivelActual se carga mas abajo desde localStorage
  var nivelesIngles = [
    {n:'A1', enfoque:'Vocabulario basico, presente simple, frases cortas',
     temas:['Verbo to be (am/is/are)', 'Pronombres personales (I, you, he...)', 'Articulos a/an/the', 'Presente simple afirmativo y negativo', 'Vocabulario: familia, numeros, colores, dias de la semana', 'Preguntas basicas (What, Where, Who)'],
     netflix:'Series infantiles con subtitulos en ingles (Bluey, Peppa Pig)', youtube:'Simple English Videos, BBC Learning English - Basics',
     horas:'60-100', evaluacion:'20 preguntas de gramatica basica + escribir un parrafo de 50 palabras presentandote + responder 5 preguntas orales simples. Minimo 80% para avanzar.'},
    {n:'A2', enfoque:'Pasado simple, vocabulario cotidiano, preguntas',
     temas:['Pasado simple (verbos regulares e irregulares)', 'Preposiciones de tiempo y lugar', 'Comparativos y superlativos', 'Vocabulario: comida, viajes, rutina diaria', 'Presente continuo vs presente simple'],
     netflix:'Extra English (serie para estudiantes)', youtube:'English Addict with Mr Duncan, Anglo-Link',
     horas:'100-120', evaluacion:'20 preguntas de gramatica + contar una anecdota pasada por escrito (80 palabras) + conversacion guiada de 5 min. Minimo 80% para avanzar.'},
    {n:'B1', enfoque:'Presente perfecto, condicionales basicos, conversacion',
     temas:['Presente perfecto (have/has + participio)', 'Primer y segundo condicional', 'Verbos modales (should, must, could)', 'Phrasal verbs comunes', 'Vocabulario: trabajo, opiniones, planes futuros'],
     netflix:'Friends, Modern Family (subtitulos en ingles)', youtube:'English with Lucy, BBC 6 Minute English',
     horas:'170-200', evaluacion:'25 preguntas de gramatica + ensayo de opinion (120 palabras) + conversacion de 8 min sobre un tema cotidiano. Minimo 75% para avanzar.'},
    {n:'B2', enfoque:'Condicionales avanzados, voz pasiva, argumentacion',
     temas:['Tercer condicional y condicionales mixtos', 'Voz pasiva en todos los tiempos', 'Reported speech (estilo indirecto)', 'Conectores de argumentacion (however, although, therefore)', 'Vocabulario: noticias, medio ambiente, tecnologia'],
     netflix:'The Office, Stranger Things', youtube:'TED-Ed, Thoughtco English',
     horas:'150-200', evaluacion:'Examen tipo Cambridge B2 (lectura + gramatica) + ensayo argumentativo (200 palabras) + entrevista oral de 10 min. Minimo 75% para avanzar.'},
    {n:'C1', enfoque:'Matices, formal/informal, acentos variados',
     temas:['Inversion enfatica (Never have I...)', 'Colocaciones avanzadas (collocations)', 'Registro formal vs informal', 'Comprension de acentos (britanico, americano, australiano)', 'Vocabulario abstracto: politica, filosofia, economia'],

     horas:'250-400', evaluacion:'Simulacro de Cambridge CPE completo + debate en vivo de 15 min con hablante nativo o tutor. Este es tu examen final antes de presentar el Cambridge real.'}
  ];

  function pintarTemario(){
    var cont = document.getElementById('temarioIngles');
    var htmlOut = '';
    for(var i=0; i<nivelesIngles.length; i++){
      var niv = nivelesIngles[i];
      var clase = (niv.n === nivelActual) ? 'nivel-item actual' : 'nivel-item';
      htmlOut += '<div class="' + clase + '">';
      htmlOut += '<b>' + niv.n + '</b>' + (niv.n === nivelActual ? ' <span style="font-size:0.7rem;color:#8a6d1f;">(estas aqui)</span>' : '');
      htmlOut += '<div class="detalle">';
      htmlOut += '<b>Enfoque:</b> ' + niv.enfoque + '<br>';
      htmlOut += '<b>Temas a investigar:</b><ul style="margin:4px 0; padding-left:18px;">';

  function obtenerPool(nivel){
    var banco = bancoPreguntas[nivel] || [];
    var usadas = usadasPorNivel[nivel] || [];
    var disponibles = [];
    for(var i=0; i<banco.length; i++){ if(usadas.indexOf(i) === -1) disponibles.push(i); }
    if(disponibles.length === 0 && banco.length > 0){
      usadasPorNivel[nivel] = [];
      for(var j=0; j<banco.length; j++) disponibles.push(j);
    }
    return disponibles;
  }

  function barajar(arr){
    var a = arr.slice();
    for(var i=a.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function siguienteNivel(actual){
    var orden = ['A1','A2','B1','B2','C1','C2'];
    var idx = orden.indexOf(actual);
    return (idx >= 0 && idx < orden.length-1) ? orden[idx+1] : null;
  }

  function iniciarExamen(){
    var banco = bancoPreguntas[nivelActual];
    var cont = document.getElementById('examenIngles');
    if(!banco || banco.length === 0){
      cont.innerHTML = '<p style="padding:10px; color:#6b6459; font-size:0.82rem;">Aun no hay banco de preguntas para este nivel. Lo agregamos cuando llegues aqui.</p>';
      return;
    }
    var disponibles = obtenerPool(nivelActual);
    var cantidad = Math.min(30, disponibles.length);
    var elegidos = barajar(disponibles).slice(0, cantidad);
    preguntasExamenActual = elegidos.map(function(idx){ return {idx:idx, pregunta:banco[idx]}; });
    respuestasExamenActual = {};
    pintarExamen();
  }

    var cont = document.getElementById('examenIngles');

  function calificarExamen(){
    var correctas = 0;
    var usadas = usadasPorNivel[nivelActual] || [];
    for(var i=0; i<preguntasExamenActual.length; i++){
      var p = preguntasExamenActual[i];
      usadas.push(p.idx);
      if(respuestasExamenActual[i] === p.pregunta.correcta) correctas++;
    }
    usadasPorNivel[nivelActual] = usadas;
    guardarLS('usadas_preguntas', usadasPorNivel);
    var total = preguntasExamenActual.length;
    var pct = total ? Math.round((correctas/total)*100) : 0;
    var aprobo = pct >= 80;
    var siguiente = siguienteNivel(nivelActual);

    var htmlR = '<div style="margin-top:10px; padding:10px; border-radius:3px; background:' + (aprobo ? '#eaf3ec' : '#fbeceb') + ';">';
    htmlR += '<b>' + correctas + '/' + total + ' correctas (' + pct + '%)</b><br>';
    if(aprobo){
      htmlR += 'Aprobado. ' + (siguiente ? 'Avanzas a nivel ' + siguiente + '.' : 'Nivel maximo alcanzado.');
    } else {
      htmlR += 'No alcanzaste el 80% necesario. Repasa los temas y vuelve a intentar — las preguntas seran distintas mientras queden nuevas disponibles.';
    }
    htmlR += '</div>';
    document.getElementById('resultadoExamen').innerHTML = htmlR;

      guardarLS('nivel_ingles', nivelActual);

    }
  }

  function evaluarProgresoVsObjetivo(cambioPeso, objetivo){

      if(cambioPeso < 0) return {mensaje:'✅ Vas en la direccion correcta para tu objetivo de perdida de peso.', color:'#eaf3ec'};
      return {mensaje:'⚠️ Tu peso subio, lo cual va en contra de tu objetivo de perdida de peso. Revisa tu adherencia al plan de calorias y a los dias de cardio.', color:'#fbecec'};
    }
    if(objetivo === 'Aumento de masa muscular'){
      if(cambioPeso > 0) return {mensaje:'✅ Vas en la direccion correcta para ganar masa. Si el aumento es muy rapido (mas de 1kg/semana), podria ser mas grasa que musculo — revisa tu progreso de cintura tambien.', color:'#eaf3ec'};
      return {mensaje:'⚠️ Tu peso bajo, lo cual va en contra de tu objetivo de ganar masa muscular. Revisa si estas comiendo suficiente (superavit calorico).', color:'#fbecec'};
    }
    if(objetivo === 'Mantenimiento / tonificacion'){
      if(Math.abs(cambioPeso) <= 1.5) return {mensaje:'✅ Tu peso se mantiene estable, alineado con tu objetivo de mantenimiento.', color:'#eaf3ec'};
      return {mensaje:'⚠️ Tu peso vario mas de lo esperado para un objetivo de mantenimiento. Revisa tu ingesta calorica.', color:'#fdf5e9'};
    }
    return null;
  }

  function calcularIMC(peso, estaturaCm){
    var m = estaturaCm / 100;
    var imc = peso / (m*m);
    var categoria;
    if(imc < 18.5) categoria = 'bajo peso';
    else if(imc < 25) categoria = 'peso saludable';
    else if(imc < 30) categoria = 'sobrepeso';
    else categoria = 'obesidad';
    return {valor: imc.toFixed(1), categoria: categoria};
  }

    var notaImpacto = '';
    if(imc && (imc.categoria === 'sobrepeso' || imc.categoria === 'obesidad')){
      notaImpacto = ' Como tu IMC actual sugiere cuidar el impacto en las articulaciones, cambiamos saltos y sprints por versiones de bajo impacto (caminata rapida, step-ups controlados) hasta que ganes base de resistencia.';
    }
    return filosofia.nota + ' ' + notaCuerpo + notaImpacto + ' Distribucion semanal: ' + filosofia.fuerzaDias + ' dias de fuerza, ' + filosofia.cardioDias + ' de cardio, ' + filosofia.descanso + ' de descanso.';
  }

  function obtenerPesoActual(perfil){
    for(var i = medidasHistorial.length-1; i>=0; i--){
      if(medidasHistorial[i].peso) return medidasHistorial[i].peso;
    }
    return perfil.peso;
  }

  function obtenerCinturaActual(){
    for(var i = medidasHistorial.length-1; i>=0; i--){
      if(medidasHistorial[i].cintura) return medidasHistorial[i].cintura;
    }
    return null;
  }

  function calcularTMB(perfil){
    var pesoActual = obtenerPesoActual(perfil);
    var base = 10*pesoActual + 6.25*perfil.estatura - 5*perfil.edad;
    return perfil.sexo === 'Mujer' ? (base - 161) : (base + 5);
  }

  function calcularGET(tmb, dias){
    var factor = 1.2;
    if(dias >= 6) factor = 1.725;
    else if(dias >= 4) factor = 1.55;
    else if(dias >= 1) factor = 1.375;
    return tmb * factor;
  }

  function calcularMacros(get, objetivo, peso){
    var caloriasObjetivo = get;
    if(objetivo === 'Perdida de peso') caloriasObjetivo = get - 500;
    else if(objetivo === 'Aumento de masa muscular') caloriasObjetivo = get + 300;

    var gPorKgProteina = (objetivo === 'Aumento de masa muscular' || objetivo === 'Aumentar fuerza') ? 2.2 : 2.0;
    var proteinaG = Math.round(peso * gPorKgProteina);
    var proteinaKcal = proteinaG * 4;
    var grasaKcal = caloriasObjetivo * 0.25;
    var grasaG = Math.round(grasaKcal / 9);
    var carbosKcal = caloriasObjetivo - proteinaKcal - grasaKcal;
    var carbosG = Math.round(carbosKcal / 4);

    return {calorias: Math.round(caloriasObjetivo), proteinaG:proteinaG, grasaG:grasaG, carbosG:Math.max(carbosG,0)};
  }

  function panelMedico(perfil){
    var pesoActual = obtenerPesoActual(perfil);
    var imc = calcularIMC(pesoActual, perfil.estatura);
    var grasaTexto = perfil.grasa ? perfil.grasa + '%' : 'no indicado — considera medicion con antropometria o bioimpedancia';
    var examenes = ['Glicemia en ayunas + HbA1c','Perfil lipidico completo (colesterol, LDL, HDL, trigliceridos)','TSH (funcion tiroidea)','Vitamina D y ferritina','Funcion hepatica y renal basica'];
    var alerta = '';
    if(imc.categoria === 'obesidad'){ alerta = 'Con IMC en rango de obesidad, la evaluacion medica previa no es opcional — hay valores que pueden cambiar el enfoque nutricional.'; }
    else if(perfil.edad >= 40){ alerta = 'A partir de los 40 anios se recomienda ademas una evaluacion cardiovascular basica antes de iniciar entrenamiento de intensidad.'; }

    var cintura = obtenerCinturaActual();
    var riesgoCintura = null;
    if(cintura && perfil.estatura){
      var ratio = cintura / perfil.estatura;
      if(ratio >= 0.6) riesgoCintura = {nivel:'alto', ratio: ratio.toFixed(2)};
      else if(ratio >= 0.5) riesgoCintura = {nivel:'moderado', ratio: ratio.toFixed(2)};
      else riesgoCintura = {nivel:'bajo', ratio: ratio.toFixed(2)};
    }
    return {imc:imc, grasaTexto:grasaTexto, examenes:examenes, alerta:alerta, riesgoCintura:riesgoCintura, pesoActual:pesoActual};
  }

  function panelNutricion(perfil){
    var tmb = calcularTMB(perfil);
    var get = calcularGET(tmb, perfil.dias || 4);
    var macros = calcularMacros(get, perfil.objetivo, obtenerPesoActual(perfil));
    var notaAlergia = (perfil.alergias && perfil.alergias.toLowerCase() !== 'ninguna' && perfil.alergias !== '') ? 'Ajustado considerando: ' + perfil.alergias + '.' : '';
    return {tmb:Math.round(tmb), get:Math.round(get), macros:macros, notaAlergia:notaAlergia};
  }

  var splitsPorDias = {
    3: {nombre:'Full body x3', dias:['Full body A','Full body B','Full body C']},
    4: {nombre:'Upper/Lower x2', dias:['Tren superior','Tren inferior','Tren superior','Tren inferior']},
    5: {nombre:'Push/Pull/Legs + Upper/Lower', dias:['Push (empuje)','Pull (jalon)','Piernas','Tren superior','Tren inferior']},
    6: {nombre:'Push/Pull/Legs x2', dias:['Push','Pull','Piernas','Push','Pull','Piernas']}
  };

  function panelEntrenador(perfil){
    var dias = perfil.dias || 4;
    var split = splitsPorDias[dias] || splitsPorDias[4];
    var rir = perfil.experiencia === 'Avanzado' ? '1' : (perfil.experiencia === 'Intermedio' ? '2' : '2-3');
    var seriesBase = perfil.experiencia === 'Avanzado' ? '4-5' : '3-4';
    return {split:split, rir:rir, series:seriesBase};
  }

  function panelFisioterapia(perfil){
    var lesion = (perfil.lesiones || '').toLowerCase();
    var precauciones = [];
    if(lesion.indexOf('rodilla') !== -1){ precauciones.push('Rodilla: evita sentadilla profunda al inicio, prioriza rango parcial e isometricos en pared.'); }
    if(lesion.indexOf('espalda') !== -1 || lesion.indexOf('lumbar') !== -1){ precauciones.push('Espalda baja: evita peso muerto convencional al inicio, usa variantes con apoyo (peso muerto rumano con rango corto) y fortalece core primero.'); }
    if(lesion.indexOf('hombro') !== -1){ precauciones.push('Hombro: evita press por encima de la cabeza con carga alta al inicio, prioriza movimientos en plano neutro.'); }
    if(precauciones.length === 0 && lesion !== '' && lesion !== 'ninguna'){ precauciones.push('Modera la intensidad en la zona mencionada y progresa gradualmente.'); }
    return {precauciones:precauciones, tieneLesion: lesion !== '' && lesion !== 'ninguna'};
  }

  function esBajoImpacto(perfil){
    var imc = (perfil && perfil.peso && perfil.estatura) ? calcularIMC(perfil.peso, perfil.estatura) : null;
    return imc && (imc.categoria === 'sobrepeso' || imc.categoria === 'obesidad');
  }

  function pintarIntroFisico(modoEdicion){


    var cont = document.getElementById('introFisico');
    if(!perfilFisico || modoEdicion){
      var d = perfilFisico || {};
      var htmlOut = '<div class="form-intro">';
      htmlOut += '<div class="campo"><label>Nombre</label><input type="text" id="fNombre" value="'+(d.nombre||'')+'"></div>';
      htmlOut += '<div class="fila2">';
      htmlOut += '<div class="campo"><label>Edad</label><input type="number" id="fEdad" value="'+(d.edad||'')+'"></div>';
      htmlOut += '<div class="campo"><label>Peso inicial (kg)</label><input type="number" step="0.1" id="fPeso" value="'+(d.peso||'')+'"></div>';
      htmlOut += '</div>';
      htmlOut += '<div class="fila2">';
      htmlOut += '<div class="campo"><label>Estatura (cm)</label><input type="number" id="fEstatura" value="'+(d.estatura||'')+'"></div>';
      htmlOut += '<div class="campo"><label>Tiempo estimado</label><input type="text" id="fTiempo" placeholder="Ej: 7 semanas" value="'+(d.tiempo||'')+'"></div>';
      htmlOut += '</div>';
      htmlOut += '<div class="panel-title" style="margin-top:6px;">Medidas iniciales (punto de partida — se comparan con cada "medida de hoy" que registres despues)</div>';
      htmlOut += '<div class="grid3">';
      htmlOut += '<div class="campo"><label>Cintura inicial (cm)</label><input type="number" step="0.1" id="fCinturaInicial" value="'+(d.cinturaInicial||'')+'"></div>';
      htmlOut += '<div class="campo"><label>Cadera inicial (cm)</label><input type="number" step="0.1" id="fCaderaInicial" value="'+(d.caderaInicial||'')+'"></div>';
      htmlOut += '<div class="campo"><label>Pecho inicial (cm)</label><input type="number" step="0.1" id="fPechoInicial" value="'+(d.pechoInicial||'')+'"></div>';
      htmlOut += '</div>';
      htmlOut += '<div class="grid3">';
      htmlOut += '<div class="campo"><label>Brazo inicial (cm)</label><input type="number" step="0.1" id="fBrazoInicial" value="'+(d.brazoInicial||'')+'"></div>';
      htmlOut += '<div class="campo"><label>Pierna inicial (cm)</label><input type="number" step="0.1" id="fPiernaInicial" value="'+(d.piernaInicial||'')+'"></div>';
      htmlOut += '</div>';
      htmlOut += '<div class="campo"><label>Objetivo</label><select id="fObjetivo">';
      var objetivos = ['Perdida de peso','Aumento de masa muscular','Mantenimiento / tonificacion','Mejorar resistencia cardiovascular','Aumentar fuerza','Flexibilidad / movilidad','Recuperacion de una lesion'];
      for(var i=0; i<objetivos.length; i++){
        var sel = (d.objetivo === objetivos[i]) ? ' selected' : '';
        htmlOut += '<option value="'+objetivos[i]+'"'+sel+'>'+objetivos[i]+'</option>';
      }
      htmlOut += '</select></div>';
      htmlOut += '<div class="campo"><label>Tipo de cuerpo (morfologia)</label><select id="fMorfologia">';
      var morfologias = [
        {v:'Ectomorfo', d:'Ectomorfo - delgado, le cuesta subir de peso/musculo'},
        {v:'Mesomorfo', d:'Mesomorfo - estructura atletica, gana musculo con facilidad'},
        {v:'Endomorfo', d:'Endomorfo - estructura mas ancha, tiende a acumular grasa'},
        {v:'No estoy seguro', d:'No estoy seguro'}
      ];
      for(var mi=0; mi<morfologias.length; mi++){
        var selM = (d.morfologia === morfologias[mi].v) ? ' selected' : '';
        htmlOut += '<option value="'+morfologias[mi].v+'"'+selM+'>'+morfologias[mi].d+'</option>';
      }
      htmlOut += '</select></div>';
      htmlOut += '<div class="fila2">';
      htmlOut += '<div class="campo"><label>Sexo</label><select id="fSexo"><option value="Hombre"'+(d.sexo==='Hombre'?' selected':'')+'>Hombre</option><option value="Mujer"'+(d.sexo==='Mujer'?' selected':'')+'>Mujer</option></select></div>';
      htmlOut += '<div class="campo"><label>% grasa corporal (o vacio si no sabes)</label><input type="number" step="0.1" id="fGrasa" value="'+(d.grasa||'')+'"></div>';
      htmlOut += '</div>';
      htmlOut += '<div class="fila2">';
      htmlOut += '<div class="campo"><label>Nivel de experiencia</label><select id="fExperiencia">';
      var niveles = ['Principiante','Intermedio','Avanzado'];
      for(var ne=0; ne<niveles.length; ne++){ htmlOut += '<option value="'+niveles[ne]+'"'+(d.experiencia===niveles[ne]?' selected':'')+'>'+niveles[ne]+'</option>'; }
      htmlOut += '</select></div>';
      htmlOut += '<div class="campo"><label>Dias disponibles/semana</label><select id="fDias">';
      for(var nd=3; nd<=6; nd++){ htmlOut += '<option value="'+nd+'"'+(String(d.dias)===String(nd)?' selected':'')+'>'+nd+' dias</option>'; }
      htmlOut += '</select></div>';
      htmlOut += '</div>';
      htmlOut += '<div class="campo"><label>Lesiones previas o dolores (o "ninguna")</label><input type="text" id="fLesiones" value="'+(d.lesiones||'')+'"></div>';
      htmlOut += '<div class="campo"><label>Alergias / preferencias alimentarias (o "ninguna")</label><input type="text" id="fAlergias" value="'+(d.alergias||'')+'"></div>';
      htmlOut += '<button class="btn-guardar-intro" id="btnGuardarIntro">Guardar</button>';
      htmlOut += '</div>';
      cont.innerHTML = htmlOut;
      document.getElementById('btnGuardarIntro').addEventListener('click', function(){
        var nuevoPeso = parseFloat(document.getElementById('fPeso').value);
        var nuevaEstatura = parseFloat(document.getElementById('fEstatura').value);
        perfilFisico = {
          nombre: document.getElementById('fNombre').value.trim(),
          edad: document.getElementById('fEdad').value,
          peso: nuevoPeso,
          estatura: nuevaEstatura,
          cinturaInicial: parseFloat(document.getElementById('fCinturaInicial').value) || null,
          caderaInicial: parseFloat(document.getElementById('fCaderaInicial').value) || null,
          pechoInicial: parseFloat(document.getElementById('fPechoInicial').value) || null,
          brazoInicial: parseFloat(document.getElementById('fBrazoInicial').value) || null,
          piernaInicial: parseFloat(document.getElementById('fPiernaInicial').value) || null,
          objetivo: document.getElementById('fObjetivo').value,
          morfologia: document.getElementById('fMorfologia').value,
          sexo: document.getElementById('fSexo').value,
          grasa: parseFloat(document.getElementById('fGrasa').value) || null,
          experiencia: document.getElementById('fExperiencia').value,
          dias: parseInt(document.getElementById('fDias').value),
          lesiones: document.getElementById('fLesiones').value.trim(),
          alergias: document.getElementById('fAlergias').value.trim(),
          tiempo: document.getElementById('fTiempo').value.trim()
        };
        guardarLS('perfil_fisico', perfilFisico);
        pintarIntroFisico(false);
        pintarTodo();
      });
    } else {
      var imc = (perfilFisico.peso && perfilFisico.estatura) ? calcularIMC(perfilFisico.peso, perfilFisico.estatura) : null;
      var htmlOut2 = '<div class="resumen-fisico">';
      htmlOut2 += '<b>' + (perfilFisico.nombre || 'Hola') + '</b> — ' + (perfilFisico.edad ? perfilFisico.edad + ' anios, ' : '') + perfilFisico.peso + ' kg, ' + perfilFisico.estatura + ' cm<br>';
      htmlOut2 += 'Objetivo: <b>' + perfilFisico.objetivo + '</b>' + (perfilFisico.tiempo ? ' en ' + perfilFisico.tiempo : '') + '<br>';
      if(imc){ htmlOut2 += 'IMC actual: ' + imc.valor + ' (' + imc.categoria + ')<br>'; }
      htmlOut2 += '<div style="margin-top:8px; padding:8px; background:#fdf8ec; border-radius:3px; font-size:0.8rem; line-height:1.5;"><b>Tu plan profesional:</b> ' + generarNotaProfesional(perfilFisico) + '</div>';

      var med = panelMedico(perfilFisico);
      htmlOut2 += '<div class="panel-especialista"><div class="titulo-esp">🩺 Medico Deportologo</div><div class="cuerpo-esp">';
      htmlOut2 += 'Peso usado en calculos: ' + med.pesoActual + ' kg' + (med.pesoActual !== perfilFisico.peso ? ' (actualizado desde tus mediciones)' : '') + '<br>';
      htmlOut2 += 'IMC: ' + med.imc.valor + ' (' + med.imc.categoria + ') · % grasa: ' + med.grasaTexto + '<br>';
      if(med.riesgoCintura){
        htmlOut2 += 'Indice cintura-altura: ' + med.riesgoCintura.ratio + ' (riesgo ' + med.riesgoCintura.nivel + ')<br>';
      } else {
        htmlOut2 += '<span style="color:var(--muted);">Registra tu cintura en "Toma de medidas" para calcular el indice cintura-altura (mejor indicador de riesgo que el IMC solo).</span><br>';
      }
      if(med.alerta) htmlOut2 += '<b>' + med.alerta + '</b><br>';
      htmlOut2 += 'Examenes recomendados antes de iniciar:<ul>';
      for(var e=0; e<med.examenes.length; e++){ htmlOut2 += '<li>' + med.examenes[e] + '</li>'; }
      htmlOut2 += '</ul></div></div>';

      var nut = panelNutricion(perfilFisico);
      htmlOut2 += '<div class="panel-especialista"><div class="titulo-esp">🥗 Nutricionista Deportivo</div><div class="cuerpo-esp">';
      htmlOut2 += 'TMB: ' + nut.tmb + ' kcal · GET: ' + nut.get + ' kcal<br>';
      htmlOut2 += '<b>Meta diaria: ' + nut.macros.calorias + ' kcal</b>';
      if(nut.notaAlergia) htmlOut2 += '<br>' + nut.notaAlergia;
      htmlOut2 += '<table class="macro-tabla"><tr><td>Proteina</td><td>' + nut.macros.proteinaG + ' g</td></tr><tr><td>Grasas</td><td>' + nut.macros.grasaG + ' g</td></tr><tr><td>Carbohidratos</td><td>' + nut.macros.carbosG + ' g</td></tr></table>';
      htmlOut2 += '</div></div>';

      var ent = panelEntrenador(perfilFisico);
      htmlOut2 += '<div class="panel-especialista"><div class="titulo-esp">🏋️ Entrenador — Alto Rendimiento</div><div class="cuerpo-esp">';
      htmlOut2 += 'Split: <b>' + ent.split.nombre + '</b> · Series: ' + ent.series + ' · RIR objetivo: ' + ent.rir + '<br>';
      htmlOut2 += 'Distribucion: ' + ent.split.dias.join(' → ');
      htmlOut2 += '</div></div>';

      var fisio = panelFisioterapia(perfilFisico);
      htmlOut2 += '<div class="panel-especialista"><div class="titulo-esp">🦴 Fisioterapeuta — Biomecanica</div><div class="cuerpo-esp">';
      htmlOut2 += 'Calentamiento dinamico (8-10 min): movilidad de cadera, tobillo, rotacion toracica, activacion de gluteo.';
      if(fisio.tieneLesion){
        htmlOut2 += '<br><b>Precauciones segun tus lesiones/dolores:</b><ul>';
        for(var p=0; p<fisio.precauciones.length; p++){ htmlOut2 += '<li>' + fisio.precauciones[p] + '</li>'; }
        htmlOut2 += '</ul>';
      } else {
        htmlOut2 += '<br>No reportaste lesiones — mantente atento a cualquier molestia y ajusta la carga si aparece.';
      }
      htmlOut2 += '</div></div>';

      htmlOut2 += '<button class="link-editar" id="btnEditarIntro">Editar mis datos</button>';
      htmlOut2 += '</div>';
      cont.innerHTML = htmlOut2;
      document.getElementById('btnEditarIntro').addEventListener('click', function(){ pintarIntroFisico(true); });
    }
  }

  function pintarTodo(){
    document.getElementById('tituloNivelIngles').textContent = 'Inglés — Nivel ' + nivelActual;
    document.getElementById('tituloFisicoHoy').textContent = 'Ejercicio de hoy — ' + nombreTipoDiaHoy();
    pintarChecklist('listaFisico', generarTareasFisicoHoy(), 'fisico-');
    pintarChecklist('listaIngles', tareasPorNivel[nivelActual], 'ingles-');
    pintarChecklist('listaJoyeria', tareasJoyeria, 'joyeria-');
    pintarTemario();
    pintarMensajeJefe();
  }
  pintarIntroFisico(false);
  pintarMedidas();
  pintarTodo();

  document.getElementById('btnIniciarExamen').addEventListener('click', iniciarExamen);

  document.getElementById('btnBorrarTodo').addEventListener('click', function(){
    var confirmar = confirm('¿Seguro que quieres borrar TODOS los datos guardados (perfil, medidas, tareas, nivel de ingles)? Esto no se puede deshacer.');
    if(!confirmar) return;
    var claves = [];
    for(var i=0; i<localStorage.length; i++){ claves.push(localStorage.key(i)); }
    claves.forEach(function(k){ localStorage.removeItem(k); });
    location.reload();
  });

  var botones = document.querySelectorAll('.tab-btn');
  for(var k=0; k<botones.length; k++){
    botones[k].addEventListener('click', function(){
      var todos = document.querySelectorAll('.tab-btn');
      for(var m=0; m<todos.length; m++){ todos[m].classList.remove('active'); }
      var contenidos = document.querySelectorAll('.tab-content');
      for(var n=0; n<contenidos.length; n++){ contenidos[n].classList.remove('active'); }
      this.classList.add('active');
      document.getElementById('tab-' + this.getAttribute('data-tab')).classList.add('active');
    });
  }
});
</script>
